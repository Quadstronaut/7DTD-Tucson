size = 10240

[box]
west = -111.14
east = -110.66   # widened 2026-09-24: whole Catalina Hwy to Summerhaven/Ski Valley
south = 32.10
north = 32.47

[height]
# Piecewise-linear elevation (m) -> block height, clamped at the ends. Knee at 1000 m keeps the
# (really flat) Tucson basin in a narrow band and spends the vertical budget on the mountains.
# Summit target 235 (user, 2026-09-24); dtm.raw can encode up to 255.99.
curve = [[650.0, 35.0], [1000.0, 48.0], [2800.0, 235.0]]

# Separable piecewise-linear warp. km measured from box west / box south.
# Pairs are [real_km, world_block]; must start at [0,0] and end at [span_km, size].
#
# "Balanced" profile (user, 2026-09-28). The 10240 blocks per axis are zero-sum, so buying detail
# downtown means spending it out of the mountains. Downtown goes to ~2 m/block so that real-metre
# road widths fit: at ~100 m real street spacing that is ~50 blocks apart, leaving ~24 blocks of
# buildable city block after a 26-block arterial. At the old 2.75 m/block it was 36 apart and only
# 10 blocks survived, which is why the grid would have gone solid asphalt.
#
# The mountains pay for it at ~7 m/block. That is the floor, not a target: Catalina Hwy's
# switchbacks are the whole point of that corridor and a 30 m hairpin radius is only ~4 blocks at
# 7 m/block. Coarsening further smears the hairpins into a straight ramp.
#
#   x segment                              km   blocks  m/block
#   Old Tucson / west wall               3.00      750     4.00
#   Tucson Mtns -> west side            11.00     1571     7.00
#   DOWNTOWN + UA                        5.50     2750     2.00
#   midtown west                         2.00      400     5.00
#   midtown -> Skate Country -> DM      10.00     2778     3.60
#   east side -> Catalina Hwy -> Lemmon 13.68     1991     6.87
#
#   z segment                              km   blocks  m/block
#   far south / San Xavier               3.00      500     6.00
#   south side + TUS airport             7.00     1750     4.00
#   22nd St / Skate Country              2.50     1136     2.20
#   DOWNTOWN + UA                        3.50     1944     1.80
#   north of UA                          6.00     1429     4.20
#   north side -> Catalinas             14.00     2154     6.50
#   Mt Lemmon top                        4.91     1327     3.70
[warp]
x = [[0.0, 0], [3.0, 750], [14.0, 2321], [19.5, 5071], [21.5, 5471], [31.5, 8249], [45.18, 10240]]
z = [[0.0, 0], [3.0, 500], [10.0, 2250], [12.5, 3386], [16.0, 5330], [22.0, 6759], [36.0, 8913], [40.91, 10240]]

[biomes]            # upper bound (m) -> color; checked in order
bands = [[1350.0, "FFE477"], [2500.0, "004000"], [1e9, "FFFFFF"]]

# Zones flattened to their median elevation. osm = Overpass selector (polygon source);
# rect = [south, west, north, east] explicit area.
[[zones]]
name = "dm_afb"
osm = 'relation["name"="Davis-Monthan Air Force Base"]["landuse"="military"]'
[[zones]]
name = "tus_airport"
osm = 'relation["aeroway"="aerodrome"]["iata"="TUS"]'
[[zones]]
name = "ua_campus"
osm = 'relation["amenity"="university"]["name"="University of Arizona"]'
[[zones]]
name = "old_tucson"
osm = 'way["tourism"="theme_park"]["name"="Old Tucson"]'
[[zones]]
name = "downtown"
rect = [32.214, -110.980, 32.230, -110.962]
[[zones]]
name = "skate_country"
rect = [32.2045, -110.8245, 32.2082, -110.8200]

[roads]             # OSM highway class -> [width_blocks, splat]  (splat: "R" asphalt, "G" gravel)
motorway = [7, "R"]          # per carriageway (I-10/I-19 are two oneway ways)
motorway_link = [5, "R"]
trunk = [8, "R"]
trunk_link = [5, "R"]
primary = [8, "R"]
primary_link = [5, "R"]
secondary = [7, "R"]
secondary_link = [5, "R"]
tertiary = [5, "R"]
runway = [15, "R"]           # aeroway=runway (DM AFB, TUS)
feather = 6                  # blocks of blend from road edge to natural terrain
profile_sigma = 25           # blocks, 1-D smoothing of the terrain profile along each road
