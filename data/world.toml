size = 10240

[box]
west = -111.14
east = -110.66   # widened 2026-09-24: whole Catalina Hwy to Summerhaven/Ski Valley
south = 32.10
north = 32.47

[height]
# Piecewise-linear elevation (m) -> block height, clamped at the ends. Knee at 1000 m keeps the
# (really flat) Tucson basin in a narrow band and spends the vertical budget on the mountains.
# Summit target 235 (user, 2026-09-24); dtm.raw can encode up to 255.99.
curve = [[650.0, 35.0], [1000.0, 48.0], [2800.0, 235.0]]

# Separable piecewise-linear warp. km measured from box west / box south.
# Pairs are [real_km, world_block]; must start at [0,0] and end at [span_km, size].
[warp]
x = [[0.0, 0], [3.0, 1100], [14.0, 3000], [19.5, 5000], [21.5, 5350], [31.5, 7700], [45.18, 10240]]
z = [[0.0, 0], [3.0, 650], [10.0, 2600], [12.5, 3350], [16.0, 4700], [22.0, 6050], [36.0, 8900], [40.91, 10240]]

[biomes]            # upper bound (m) -> color; checked in order
bands = [[1350.0, "FFE477"], [2500.0, "004000"], [1e9, "FFFFFF"]]

# Zones flattened to their median elevation. osm = Overpass selector (polygon source);
# rect = [south, west, north, east] explicit area.
[[zones]]
name = "dm_afb"
osm = 'relation["name"="Davis-Monthan Air Force Base"]["landuse"="military"]'
[[zones]]
name = "tus_airport"
osm = 'relation["aeroway"="aerodrome"]["iata"="TUS"]'
[[zones]]
name = "ua_campus"
osm = 'relation["amenity"="university"]["name"="University of Arizona"]'
[[zones]]
name = "old_tucson"
osm = 'way["tourism"="theme_park"]["name"="Old Tucson"]'
[[zones]]
name = "downtown"
rect = [32.214, -110.980, 32.230, -110.962]
[[zones]]
name = "skate_country"
rect = [32.2045, -110.8245, 32.2082, -110.8200]

[roads]             # OSM highway class -> [width_blocks, splat]  (splat: "R" asphalt, "G" gravel)
motorway = [7, "R"]          # per carriageway (I-10/I-19 are two oneway ways)
motorway_link = [5, "R"]
trunk = [8, "R"]
trunk_link = [5, "R"]
primary = [8, "R"]
primary_link = [5, "R"]
secondary = [7, "R"]
secondary_link = [5, "R"]
tertiary = [5, "R"]
feather = 6                  # blocks of blend from road edge to natural terrain
profile_sigma = 25           # blocks, 1-D smoothing of the terrain profile along each road
