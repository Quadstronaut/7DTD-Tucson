# Hand-picked landmark placements. Coordinates come from OSM: `osm` = Overpass selector, `q` = Nominatim
# name search bounded to the map box (both resolved + cached),
# or explicit `at = [lat, lon]` only where OSM has no usable feature. `offset = [east_blocks, north_blocks]`
# nudges the prefab off the OSM point (e.g. off a road). `rot` = 0..3 (game prefab rotation).
# The prefab's CENTER goes on the point; its footprint gets a flat pad.

# ---------- Skate Country (the reason this map exists) ----------
[[place]]
id = "skate_country"
prefab = "remnant_sports_center_01"
at = [32.206377, -110.822252]      # 7980 E 22nd St, US Census geocoder (no OSM feature for the rink)
offset = [0, -57]                  # SOUTH side of 22nd St (user-confirmed 2026-09-24): 4 road + 50 half-prefab + 3 apron
rot = 0                            # custom Skate Country prefab planned (co-work with user)

# ---------- University of Arizona ----------
[[place]]
id = "arizona_stadium"
prefab = "football_stadium"
osm = 'nwr["name"="Arizona Stadium"]'
rot = 0
[[place]]
id = "ua_old_main"
prefab = "school_01"
osm = 'nwr["name"="Old Main"](32.22,-110.96,32.24,-110.94)'
rot = 0
[[place]]
id = "ua_mckale"
prefab = "school_03"
osm = 'nwr["name"~"McKale",i](32.22,-110.96,32.24,-110.94)'
offset = [35, 0]                   # stand-in is bigger than the real arena; keep it clear of the stadium (it is NE of it IRL)
rot = 0
[[place]]
id = "banner_umc"
prefab = "hospital_01"
q = "Banner University Medical Center Tucson"
rot = 0

